version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - asasalint
    - bodyclose
    - gocyclo
    - gosec
    - revive
  settings:
    gocyclo:
      min-complexity: 20
  exclusions:
    rules:
      - linters: [revive]
        text: "should have comment|package-comments|unused-parameter"
      - linters: [staticcheck]
        text: "QF1008"
      - linters: [gosec]
        path: _test\.go
      - linters: [gosec]
        text: "G703"
        path: internal/infrastructure/config/loader/
      - linters: [gosec]
        text: "G124"
        path: internal/transport/gateway/
      - linters: [revive]
        text: "var-naming"
        path: internal/transport/grpc/handler/

issues:
  max-issues-per-linter: 100
  max-same-issues: 5
